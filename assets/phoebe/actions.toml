frames = ["idle01", "idle02", "idle03", "idle04", "idle05", "idle06", "idle07", "idle08", "idle09", "idle10", "idle11", "idle12", "idle13", "idle14", "idle15", "idle16", "idle17", "idle18", "idle19", "idle20", "idle21", "idle22", "idle23", "idle24", "idle25", "idle26", "idle27", "idle28", "idle29", "idle30", "idle31", "idle32"]
