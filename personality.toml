# 기분에 따른 성격. 기분 이름: sleepy(졸림) sulky(시무룩) bored(심심) happy(기분 좋음) calm(차분)
#
# [affinity.<동작>]  기분별로 그 동작이 뽑힐 가중치에 곱할 배수. 1이면 그대로,
#                    1보다 크면 더 자주, 1보다 작으면 덜 자주, 0이면 아예 안 뽑는다.
#                    적지 않은 기분은 1로 본다. 음수는 쓸 수 없다.
# [lines]            말풍선 대신 쓰는 짧은 혼잣말. 기분 이름과 상황 이름(thrown woke
#                    released lunch evening late_night)별로 여러 줄을 적어 둔다.

[affinity.lie]
sleepy = 4.0
sulky = 1.5
happy = 0.5

[affinity.doze_off]
sleepy = 4.0
bored = 1.2
happy = 0.3

[affinity.lie_down]
sleepy = 3.0
sulky = 1.5
happy = 0.5

[affinity.sit]
sleepy = 2.0
sulky = 2.0
calm = 1.5
happy = 0.8

[affinity.sit_down]
sleepy = 2.0
sulky = 2.0
calm = 1.3

[affinity.sit_dangle]
sleepy = 1.2
sulky = 2.5
calm = 1.5
happy = 0.8

[affinity.run]
sleepy = 0.1
sulky = 0.5
bored = 2.0
happy = 2.5

[affinity.to_run]
sleepy = 0.1
sulky = 0.5
bored = 2.0
happy = 2.5

[affinity.walk]
sleepy = 0.4
sulky = 0.7
bored = 1.5
happy = 1.8

[affinity.to_walk]
sleepy = 0.4
sulky = 0.7
bored = 1.5
happy = 1.8

[affinity.creep]
sleepy = 0.6
sulky = 2.0
bored = 1.2
happy = 0.6

[affinity.look_up]
sleepy = 0.5
bored = 1.8
happy = 1.5
calm = 1.3

[affinity.wall_climb]
sleepy = 0.1
sulky = 0.4
bored = 2.0
happy = 2.0

[affinity.ceiling_move]
sleepy = 0.1
sulky = 0.4
bored = 1.8
happy = 2.0

